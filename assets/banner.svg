<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-labelledby="t d">
  <title id="t">disk-cleanup</title>
  <desc id="d">Sweep caches, finished worktrees and idle dependency folders off your dev machine.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="279" rx="16" fill="#0d1117" stroke="#30363d"/>

  <!-- left: title -->
  <text x="56" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#f0f6fc">disk-cleanup</text>
  <rect x="58" y="128" width="64" height="4" rx="2" fill="url(#accent)"/>
  <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8b949e">
    <tspan x="56" y="168">Sweep caches, finished worktrees and</tspan>
    <tspan x="56" y="194">idle dependency folders off your dev machine.</tspan>
  </text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <rect x="56" y="216" width="118" height="28" rx="14" fill="none" stroke="#30363d"/>
    <text x="115" y="235" text-anchor="middle" fill="#c9d1d9">macOS · bash</text>
    <rect x="184" y="216" width="132" height="28" rx="14" fill="none" stroke="#30363d"/>
    <text x="250" y="235" text-anchor="middle" fill="#c9d1d9">Fedora · systemd</text>
  </g>

  <!-- right: terminal -->
  <rect x="500" y="40" width="404" height="200" rx="10" fill="#161b22" stroke="#30363d"/>
  <circle cx="522" cy="60" r="5" fill="#ff5f56"/>
  <circle cx="540" cy="60" r="5" fill="#ffbd2e"/>
  <circle cx="558" cy="60" r="5" fill="#27c93f"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <text x="522" y="94" fill="#c9d1d9"><tspan fill="#3fb950">$</tspan> disk-cleanup --expanded</text>
    <text x="522" y="120" fill="#8b949e">go build cache</text>
    <text x="760" y="120" text-anchor="end" fill="#c9d1d9">23G</text>
    <text x="790" y="120" fill="#3fb950">remove</text>
    <text x="522" y="140" fill="#8b949e">merged-PR worktrees</text>
    <text x="760" y="140" text-anchor="end" fill="#c9d1d9">25</text>
    <text x="790" y="140" fill="#3fb950">remove</text>
    <text x="522" y="160" fill="#8b949e">idle node_modules</text>
    <text x="760" y="160" text-anchor="end" fill="#c9d1d9">6</text>
    <text x="790" y="160" fill="#3fb950">remove</text>
    <text x="522" y="180" fill="#8b949e">open PR / dirty / new</text>
    <text x="760" y="180" text-anchor="end" fill="#c9d1d9">-</text>
    <text x="790" y="180" fill="#d29922">keep</text>
  </g>
  <!-- free-space bar -->
  <text x="522" y="208" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8b949e">free space</text>
  <rect x="604" y="198" width="280" height="10" rx="5" fill="#21262d"/>
  <rect x="604" y="198" width="124" height="10" rx="5" fill="url(#accent)"/>
  <rect x="604" y="198" width="22" height="10" rx="5" fill="#f85149"/>
  <text x="522" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#c9d1d9">19 GiB → 100 GiB</text>
</svg>
