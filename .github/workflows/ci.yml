---
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Syntax check
        run: |
          set -euo pipefail
          for script in macos/disk-cleanup fedora/disk-cleanup; do
            bash -n "$script"
          done

      - name: ShellCheck
        run: shellcheck -s bash macos/disk-cleanup fedora/disk-cleanup tests/disk-cleanup.sh
      - name: Fedora script matches macOS script
        run: cmp macos/disk-cleanup fedora/disk-cleanup
      - name: Fixture tests
        run: tests/disk-cleanup.sh
